<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Formulario</title>

    <style>
        body {
            font-family: Arial;
            font-size: 14px;
            color: black;
            background-color: #f5f5f5;
            margin: 20px;
        }

        form {
            background-color: white;
            margin: 10px;
            padding: 20px;
            border: 1px solid gray;
            border-radius: 10px;
        }

        fieldset {
            margin: 10px;
            padding: 15px;
            border: 1px solid gray;
            border-radius: 10px;
        }

        label {
            color: #555555;
        }

        input, select, textarea {
            width: 95%;
            padding: 10px;
            margin: 5px;
            border: 1px solid gray;
            border-radius: 8px;
        }

        input[type="radio"], input[type="checkbox"] {
            width: auto;
        }

        button {
            background-color: black;
            color: white;
            padding: 10px;
            margin: 5px;
            border: 1px solid black;
            border-radius: 8px;
        }

        p {
            text-align: center;
        }
    </style>
</head>

<body>

<form>
    <fieldset>
        <legend>Formulario</legend>

       
        <fieldset>
            <legend>1. Dades personals</legend>

            <label for="nom">Nom *</label>
            <input type="text" id="nom" name="nom" placeholder="Escriu el teu nom" required>

            <label for="cognoms">Cognoms *</label>
            <input type="text" id="cognoms" name="cognoms" placeholder="Escriu els cognoms" required>

            <label for="correu">Correu electronic *</label>
            <input type="email" id="correu" name="correu" placeholder="exemple@correu.com" required>

            <label for="telefon">Telefon</label>
            <input type="tel" id="telefon" name="telefon" placeholder="600 000 000">

            <label for="data">Data de naixement *</label>
            <input type="date" id="data" name="data" required>

            <label for="contrasenya">Contrasenya *</label>
            <input type="password" id="contrasenya" name="contrasenya" placeholder="Contrasenya" required>

        </fieldset>

        <fieldset>
            <legend>2. Informació acadèmica</legend>

            <label for="curs">Curs actual *</label>
            <select id="curs" name="curs" required>
                <option value="">Selecciona un curs</option>
                <option value="1r-smx">1r SMX</option>
                <option value="2n-smx">2n SMX</option>
            </select>

            <p>Activitat que vols realitzar *</p>

            <input type="radio" id="programacio" name="activitat" value="programacio" required>
            <label for="programacio">Programació</label><br>

            <input type="radio" id="robotica" name="activitat" value="robotica">
            <label for="robotica">Robòtica</label><br>

            <input type="radio" id="disseny" name="activitat" value="disseny">
            <label for="disseny">Disseny web</label><br>

            <input type="radio" id="esports" name="activitat" value="esports">
            <label for="esports">Esports</label>

            <p>Dies disponibles</p>

            <input type="checkbox" id="dilluns" name="dies" value="dilluns">
            <label for="dilluns">Dilluns</label><br>

            <input type="checkbox" id="dimarts" name="dies" value="dimarts">
            <label for="dimarts">Dimarts</label><br>

            <input type="checkbox" id="dimecres" name="dies" value="dimecres">
            <label for="dimecres">Dimecres</label><br>

            <input type="checkbox" id="dijous" name="dies" value="dijous">
            <label for="dijous">Dijous</label><br>

            <input type="checkbox" id="divendres" name="dies" value="divendres">
            <label for="divendres">Divendres</label>

        </fieldset>

        <fieldset>
            <legend>3. Informació addicional</legend>

            <label for="color">Color preferit</label>
            <input type="color" id="color" name="color">

            <label for="nivell">Nivell d'experiència (0 a 10)</label>
            <input type="range" id="nivell" name="nivell" min="0" max="10">

            <label for="comentaris">Comentaris o observacions</label>
            <textarea id="comentaris" name="comentaris" rows="4" placeholder="Escriu aquí..."></textarea>

            <label for="document">Adjunta un document</label>
            <input type="file" id="document" name="document">

        </fieldset>

        <input type="checkbox" id="condicions" name="condicions" value="acceptat" required>
        <label for="condicions">Accepto les condicions d'inscripció *</label>

        <p>
            <button type="submit">Enviar inscripció</button>
            <button type="reset">Netejar</button>
        </p>

        <p>* Camps obligatoris</p>

    </fieldset>
</form>

</body>
</html>
